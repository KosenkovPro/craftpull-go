name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --- Windows: cgo обязателен (Fyne), компилятор — mingw-w64 ---
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Подготовить mingw-w64
        continue-on-error: true
        run: |
          choco install mingw -y --no-progress
          echo "C:\ProgramData\mingw64\bin" >> $env:GITHUB_PATH
          echo "C:\mingw64\bin" >> $env:GITHUB_PATH

      - name: Проверка cgo
        shell: pwsh
        run: |
          gcc --version
          go env CGO_ENABLED

      - name: Сборка
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -ldflags "-H windowsgui -s -w" -o dist/craftpull-windows-amd64.exe ./cmd/craftpull
          ./dist/craftpull-windows-amd64.exe --version

      - name: Упаковать zip
        shell: pwsh
        run: Compress-Archive -Path dist/craftpull-windows-amd64.exe, README.md, README.ru.md -DestinationPath dist/craftpull-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: craftpull-windows-amd64
          path: |
            dist/craftpull-windows-amd64.exe
            dist/craftpull-windows-amd64.zip

  # --- macOS: отдельно Intel и Apple Silicon ---
  # Метки раннеров: macos-15-intel — Intel, macos-15 — Apple Silicon.
  # Старые macos-13 и macos-14 GitHub больше не предоставляет.
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Сборка ${{ matrix.arch }}
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -ldflags "-s -w" -o dist/craftpull-darwin-${{ matrix.arch }} ./cmd/craftpull
          file dist/craftpull-darwin-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: craftpull-darwin-${{ matrix.arch }}
          path: dist/craftpull-darwin-${{ matrix.arch }}

  # --- macOS 11 (Big Sur): legacy-сборка на Go 1.24 ---
  # cgo не умеет кросс-компилировать macOS, поэтому каждая архитектура
  # собирается на своём раннере.
  macos-legacy:
    name: macOS ${{ matrix.arch }} (legacy, Go 1.24)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"
          cache: true

      - name: Сборка ${{ matrix.arch }}
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -ldflags "-s -w" -o dist/craftpull-darwin-${{ matrix.arch }}-legacy ./cmd/craftpull
          file dist/craftpull-darwin-${{ matrix.arch }}-legacy

      - uses: actions/upload-artifact@v4
        with:
          name: craftpull-darwin-${{ matrix.arch }}-legacy
          path: dist/craftpull-darwin-${{ matrix.arch }}-legacy

  # --- macOS 11: universal из legacy-сборок ---
  macos-universal-legacy:
    name: macOS universal (legacy, Go 1.24)
    needs: [macos-legacy]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: |
            craftpull-darwin-amd64-legacy
            craftpull-darwin-arm64-legacy
          merge-multiple: true
          path: dist

      - name: Universal-бинарник
        run: |
          lipo -create -output dist/craftpull-darwin-universal-legacy \
            dist/craftpull-darwin-amd64-legacy dist/craftpull-darwin-arm64-legacy
          lipo -info dist/craftpull-darwin-universal-legacy

      - uses: actions/upload-artifact@v4
        with:
          name: craftpull-darwin-universal-legacy
          path: dist/craftpull-darwin-universal-legacy

  # --- macOS universal: Intel + Apple Silicon одним файлом ---
  macos-universal:
    name: macOS universal
    needs: [macos]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/download-artifact@v4
        with:
          pattern: |
            craftpull-darwin-amd64
            craftpull-darwin-arm64
          merge-multiple: true
          path: dist

      - name: Universal-бинарник
        run: |
          lipo -create -output dist/craftpull-darwin-universal \
            dist/craftpull-darwin-amd64 dist/craftpull-darwin-arm64
          lipo -info dist/craftpull-darwin-universal

      - name: Пакет .app
        run: |
          chmod +x scripts/make-app-bundle.sh
          scripts/make-app-bundle.sh dist/craftpull-darwin-universal dist/CraftPull.app

      - name: Архив и образ диска
        run: |
          zip -qry dist/craftpull-macos-universal.zip dist/CraftPull.app
          hdiutil create -volname CraftPull -srcfolder dist/CraftPull.app -ov -format UDZO dist/craftpull-macos-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: craftpull-macos-universal
          path: |
            dist/craftpull-darwin-universal
            dist/craftpull-macos-universal.zip
            dist/craftpull-macos-universal.dmg

  # --- Проверки: vet, тесты, консольная сборка и кросс-компиляция ---
  check:
    name: Проверки (vet, тесты, nocgo, кросс-компиляция)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Fyne на Linux собирается с cgo: нужны заголовки OpenGL, X11,
      # XKB common и Wayland (GLFW берёт их при компиляции).
      - name: Зависимости для Fyne
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libglu1-mesa-dev xorg-dev \
            libxxf86vm-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols

      - name: go vet
        run: go vet ./...

      - name: Тесты
        run: go test -count=1 ./internal/...

      - name: Сборка без cgo
        env:
          CGO_ENABLED: "0"
        run: go build -o dist/craftpull-nocgo ./cmd/craftpull

      - name: Кросс-компиляция
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -o dist/craftpull-nocgo-darwin-$arch ./cmd/craftpull
          done
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o dist/craftpull-nocgo-windows-amd64.exe ./cmd/craftpull

  # --- Релиз ---
  release:
    name: Релиз
    needs: [windows, macos-universal, macos-universal-legacy]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: craftpull-*
          merge-multiple: true
          path: dist

      - name: Список файлов
        run: ls -lh dist

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/craftpull-windows-amd64.zip
            dist/craftpull-darwin-amd64
            dist/craftpull-darwin-arm64
            dist/craftpull-darwin-universal
            dist/craftpull-macos-universal.zip
            dist/craftpull-macos-universal.dmg
            dist/craftpull-darwin-universal-legacy
          generate_release_notes: true
